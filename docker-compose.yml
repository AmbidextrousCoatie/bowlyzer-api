# Stats API warehouse. Import is a one-shot; the API process does not scrape.
#
#   docker compose run --rm import
#   docker compose up api
#
# Override the Parquet mount (published files live in bowlyzer_deploy):
#   BOWLYZER_PARQUET_DIR=/absolute/path/to/database/data docker compose run --rm import

services:
  import:
    build: .
    environment:
      PARQUET_DIR: /data/parquet
      WAREHOUSE_PATH: /var/lib/bowlyzer/bowlyzer.duckdb
    volumes:
      - ${BOWLYZER_PARQUET_DIR:-../bowlyzer_deploy/database/data}:/data/parquet:ro
      - ./data:/var/lib/bowlyzer
    command: ["python", "scripts/run_import.py"]

  api:
    build: .
    ports:
      - "${BOWLYZER_HOST_PORT:-8080}:8080"
    environment:
      WAREHOUSE_PATH: /var/lib/bowlyzer/bowlyzer.duckdb
      PORT: "8080"
    volumes:
      - ./data:/var/lib/bowlyzer
    command: ["python", "-m", "bowlyzerapi.server"]
