openapi: 3.0.3
info:
  title: Bowl-A-Lyzer stats API
  version: 0.1.0
  description: |
    Read-only `/api/v1` over a single DuckDB warehouse. No acquisition, no
    `?database=` session, no JSON disk cache.

    **Serving language is still TBD.** This spec is the contract. The Python
    placeholder implements the resources in `docs/resources.md`.

    Season labels contain a slash (`25/26`). Path parameters MUST be
    percent-encoded (`25%2F26`). Query-string aliases exist so clients can
    avoid `%2F` routing issues.

    Successful responses set `X-Data-Revision` (publish run id / import time).
    The SPA should treat a changed revision as a cache bust for React Query.
    KO brackets are omitted (`ko_bracket: null`) until ported.
servers:
  - url: http://127.0.0.1:8080
    description: Local placeholder
tags:
  - name: meta
  - name: leagues
  - name: tournaments
  - name: clubs
  - name: teams
  - name: players
paths:
  /api/v1/health:
    get:
      tags: [meta]
      operationId: getHealth
      summary: Warehouse presence and row counts
      responses:
        "200":
          description: Warehouse is readable
          headers:
            X-Data-Revision:
              $ref: "#/components/headers/XDataRevision"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Warehouse file missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/meta:
    get:
      tags: [meta]
      operationId: getMeta
      summary: Filter catalog (seasons, leagues, weeks, teams, rounds, tournaments)
      parameters:
        - { name: season, in: query, schema: { type: string } }
        - { name: league, in: query, schema: { type: string } }
        - { name: week, in: query, schema: { type: integer } }
        - { name: club, in: query, schema: { type: string } }
        - { name: team, in: query, schema: { type: string } }
      responses:
        "200":
          description: Catalog object
          headers:
            X-Data-Revision:
              $ref: "#/components/headers/XDataRevision"
          content:
            application/json:
              schema: { type: object }

  /api/v1/home:
    get:
      tags: [meta]
      operationId: getHome
      summary: Landing counts + latest events
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 8 } }
      responses:
        "200":
          description: Home document
          headers:
            X-Data-Revision:
              $ref: "#/components/headers/XDataRevision"
          content:
            application/json:
              schema: { type: object }

  /api/v1/seasons/{season}/standings:
    get:
      tags: [leagues]
      operationId: getSeasonStandings
      summary: All league standings in a season
      parameters:
        - $ref: "#/components/parameters/SeasonPath"
      responses:
        "200":
          description: Season standings document
          headers:
            X-Data-Revision:
              $ref: "#/components/headers/XDataRevision"
          content:
            application/json:
              schema: { type: object }

  /api/v1/leagues:
    get:
      tags: [leagues]
      operationId: listLeagues
      summary: League catalog
      parameters:
        - { name: season, in: query, schema: { type: string } }
      responses:
        "200":
          description: League names, optionally filtered by season
          headers:
            X-Data-Revision:
              $ref: "#/components/headers/XDataRevision"
          content:
            application/json:
              schema: { type: object }

  /api/v1/leagues/standings:
    get:
      tags: [leagues]
      operationId: getLeagueStandingsQuery
      summary: League standings (query alias; avoids %2F in the path)
      parameters:
        - { name: season, in: query, required: true, schema: { type: string } }
        - { name: league, in: query, required: true, schema: { type: string } }
        - { name: week, in: query, schema: { type: integer } }
        - { name: view, in: query, schema: { type: string, enum: [history, averages] } }
      responses:
        "200":
          description: League standings document
          headers:
            X-Data-Revision:
              $ref: "#/components/headers/XDataRevision"
          content:
            application/json:
              schema: { type: object }

  /api/v1/leagues/timetable:
    get:
      tags: [leagues]
      operationId: getLeagueTimetableQuery
      parameters:
        - { name: season, in: query, required: true, schema: { type: string } }
        - { name: league, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Week calendar
          headers:
            X-Data-Revision:
              $ref: "#/components/headers/XDataRevision"
          content:
            application/json:
              schema: { type: object }

  /api/v1/leagues/compare:
    get:
      tags: [leagues]
      operationId: getLeagueCompareQuery
      parameters:
        - { name: season, in: query, required: true, schema: { type: string } }
        - { name: league, in: query, required: true, schema: { type: string } }
        - { name: team_a, in: query, schema: { type: string } }
        - { name: team_b, in: query, schema: { type: string } }
      responses:
        "200":
          description: Head-to-head cell matrix
          headers:
            X-Data-Revision:
              $ref: "#/components/headers/XDataRevision"
          content:
            application/json:
              schema: { type: object }

  /api/v1/leagues/matchdays/{week}:
    get:
      tags: [leagues]
      operationId: getMatchdayQuery
      parameters:
        - { name: week, in: path, required: true, schema: { type: integer } }
        - { name: season, in: query, required: true, schema: { type: string } }
        - { name: league, in: query, required: true, schema: { type: string } }
        - { name: team, in: query, schema: { type: string } }
        - { name: round, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Matchday document
          headers:
            X-Data-Revision:
              $ref: "#/components/headers/XDataRevision"
          content:
            application/json:
              schema: { type: object }

  /api/v1/leagues/records:
    get:
      tags: [leagues]
      operationId: getLeagueRecordsQuery
      parameters:
        - { name: league, in: query, required: true, schema: { type: string } }
        - { name: season, in: query, schema: { type: string } }
        - { name: metric, in: query, schema: { type: string } }
      responses:
        "200":
          description: Record lists
          headers:
            X-Data-Revision:
              $ref: "#/components/headers/XDataRevision"
          content:
            application/json:
              schema: { type: object }

  /api/v1/leagues/{season}/{league}/standings:
    get:
      tags: [leagues]
      operationId: getLeagueStandings
      summary: League table, honor scores, week series, player averages
      parameters:
        - $ref: "#/components/parameters/SeasonPath"
        - $ref: "#/components/parameters/LeaguePath"
        - { name: week, in: query, schema: { type: integer } }
        - { name: view, in: query, schema: { type: string, enum: [history, averages] } }
      responses:
        "200":
          description: League standings document
          headers:
            X-Data-Revision:
              $ref: "#/components/headers/XDataRevision"
          content:
            application/json:
              schema: { type: object }

  /api/v1/leagues/{season}/{league}/timetable:
    get:
      tags: [leagues]
      operationId: getLeagueTimetable
      parameters:
        - $ref: "#/components/parameters/SeasonPath"
        - $ref: "#/components/parameters/LeaguePath"
      responses:
        "200":
          description: Week calendar
          headers:
            X-Data-Revision:
              $ref: "#/components/headers/XDataRevision"
          content:
            application/json:
              schema: { type: object }

  /api/v1/leagues/{season}/{league}/matchdays/{week}:
    get:
      tags: [leagues]
      operationId: getMatchday
      summary: Week table, honor, games; optional team details
      parameters:
        - $ref: "#/components/parameters/SeasonPath"
        - $ref: "#/components/parameters/LeaguePath"
        - { name: week, in: path, required: true, schema: { type: integer } }
        - { name: team, in: query, schema: { type: string } }
        - { name: round, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Matchday document
          headers:
            X-Data-Revision:
              $ref: "#/components/headers/XDataRevision"
          content:
            application/json:
              schema: { type: object }

  /api/v1/leagues/{season}/{league}/compare:
    get:
      tags: [leagues]
      operationId: getLeagueCompare
      parameters:
        - $ref: "#/components/parameters/SeasonPath"
        - $ref: "#/components/parameters/LeaguePath"
        - { name: team_a, in: query, schema: { type: string } }
        - { name: team_b, in: query, schema: { type: string } }
      responses:
        "200":
          description: Head-to-head cell matrix
          headers:
            X-Data-Revision:
              $ref: "#/components/headers/XDataRevision"
          content:
            application/json:
              schema: { type: object }

  /api/v1/leagues/{league}/records:
    get:
      tags: [leagues]
      operationId: getLeagueRecords
      summary: Record lists for a league (optional season filter)
      parameters:
        - $ref: "#/components/parameters/LeaguePath"
        - { name: season, in: query, schema: { type: string } }
        - { name: metric, in: query, schema: { type: string } }
      responses:
        "200":
          description: Record lists
          headers:
            X-Data-Revision:
              $ref: "#/components/headers/XDataRevision"
          content:
            application/json:
              schema: { type: object }

  /api/v1/leagues/{season}/{league}/records:
    get:
      tags: [leagues]
      operationId: getLeagueSeasonRecords
      parameters:
        - $ref: "#/components/parameters/SeasonPath"
        - $ref: "#/components/parameters/LeaguePath"
        - { name: metric, in: query, schema: { type: string } }
      responses:
        "200":
          description: Record lists for one season
          headers:
            X-Data-Revision:
              $ref: "#/components/headers/XDataRevision"
          content:
            application/json:
              schema: { type: object }

  /api/v1/clubs:
    get:
      tags: [clubs]
      operationId: listClubs
      parameters:
        - name: unnumbered
          in: query
          description: >
            When true, only clubs that have both an unnumbered (base) team and a
            numbered team — same filter as Flask `only_unnumbered`.
          schema: { type: boolean }
      responses:
        "200":
          description: Club names
          headers:
            X-Data-Revision:
              $ref: "#/components/headers/XDataRevision"
          content:
            application/json:
              schema: { type: object }

  /api/v1/clubs/rankings:
    get:
      tags: [clubs]
      operationId: getClubRankings
      parameters:
        - { name: top_n, in: query, schema: { type: integer, default: 5 } }
      responses:
        "200":
          description: Club ranking boards
          headers:
            X-Data-Revision:
              $ref: "#/components/headers/XDataRevision"
          content:
            application/json:
              schema: { type: object }

  /api/v1/clubs/{club}:
    get:
      tags: [clubs]
      operationId: getClub
      summary: Club legends + history
      parameters:
        - $ref: "#/components/parameters/ClubPath"
        - { name: season, in: query, schema: { type: string } }
      responses:
        "200":
          description: Club document
          headers:
            X-Data-Revision:
              $ref: "#/components/headers/XDataRevision"
          content:
            application/json:
              schema: { type: object }

  /api/v1/clubs/legends:
    get:
      tags: [clubs]
      operationId: getClubLegendsQuery
      summary: Club legends (query alias)
      parameters:
        - { name: club, in: query, required: true, schema: { type: string } }
        - { name: season, in: query, schema: { type: string } }
      responses:
        "200":
          description: Club legends document
          headers:
            X-Data-Revision:
              $ref: "#/components/headers/XDataRevision"
          content:
            application/json:
              schema: { type: object }

  /api/v1/clubs/{club}/legends:
    get:
      tags: [clubs]
      operationId: getClubLegends
      summary: Player highlights for a club
      parameters:
        - $ref: "#/components/parameters/ClubPath"
        - { name: season, in: query, schema: { type: string } }
      responses:
        "200":
          description: Club legends document
          headers:
            X-Data-Revision:
              $ref: "#/components/headers/XDataRevision"
          content:
            application/json:
              schema: { type: object }

  /api/v1/clubs/{club}/players:
    get:
      tags: [clubs]
      operationId: getClubPlayers
      parameters:
        - $ref: "#/components/parameters/ClubPath"
        - { name: season, in: query, schema: { type: string } }
      responses:
        "200":
          description: Club player results
          headers:
            X-Data-Revision:
              $ref: "#/components/headers/XDataRevision"
          content:
            application/json:
              schema: { type: object }

  /api/v1/clubs/{club}/honor/300:
    get:
      tags: [clubs]
      operationId: getClubHonor300
      parameters:
        - $ref: "#/components/parameters/ClubPath"
      responses:
        "200":
          description: Perfect games for a club
          headers:
            X-Data-Revision:
              $ref: "#/components/headers/XDataRevision"
          content:
            application/json:
              schema: { type: object }

  /api/v1/honor/300:
    get:
      tags: [clubs]
      operationId: getHonor300
      parameters:
        - { name: club, in: query, schema: { type: string } }
      responses:
        "200":
          description: Perfect games
          headers:
            X-Data-Revision:
              $ref: "#/components/headers/XDataRevision"
          content:
            application/json:
              schema: { type: object }

  /api/v1/teams:
    get:
      tags: [teams]
      operationId: listTeams
      responses:
        "200":
          description: Team names
          headers:
            X-Data-Revision:
              $ref: "#/components/headers/XDataRevision"
          content:
            application/json:
              schema: { type: object }

  /api/v1/teams/{team}:
    get:
      tags: [teams]
      operationId: getTeam
      summary: History, league comparison, clutch, consistency, special matches
      parameters:
        - { name: team, in: path, required: true, schema: { type: string } }
        - { name: season, in: query, schema: { type: string } }
      responses:
        "200":
          description: Team document
          headers:
            X-Data-Revision:
              $ref: "#/components/headers/XDataRevision"
          content:
            application/json:
              schema: { type: object }

  /api/v1/players:
    get:
      tags: [players]
      operationId: searchPlayers
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: club, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses:
        "200":
          description: Player search hits
          headers:
            X-Data-Revision:
              $ref: "#/components/headers/XDataRevision"
          content:
            application/json:
              schema: { type: object }

  /api/v1/players/{id}:
    get:
      tags: [players]
      operationId: getPlayer
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: club, in: query, schema: { type: string } }
        - { name: season, in: query, schema: { type: string } }
      responses:
        "200":
          description: Player lifetime document
          headers:
            X-Data-Revision:
              $ref: "#/components/headers/XDataRevision"
          content:
            application/json:
              schema: { type: object }

  /api/v1/players/{id}/tournaments:
    get:
      tags: [players]
      operationId: getPlayerTournaments
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Player tournament results (kernel ranks, no KO)
          headers:
            X-Data-Revision:
              $ref: "#/components/headers/XDataRevision"
          content:
            application/json:
              schema: { type: object }

  /api/v1/tournaments:
    get:
      tags: [tournaments]
      operationId: listTournaments
      parameters:
        - { name: season, in: query, schema: { type: string } }
        - { name: club, in: query, schema: { type: string } }
      responses:
        "200":
          description: Tournament catalog
          headers:
            X-Data-Revision:
              $ref: "#/components/headers/XDataRevision"
          content:
            application/json:
              schema: { type: object }

  /api/v1/tournaments/podiums:
    get:
      tags: [tournaments]
      operationId: getTournamentPodiums
      parameters:
        - { name: season, in: query, schema: { type: string } }
        - { name: club, in: query, schema: { type: string } }
        - { name: n, in: query, schema: { type: integer, default: 3 } }
      responses:
        "200":
          description: Podiums from kernel ranks (no KO)
          headers:
            X-Data-Revision:
              $ref: "#/components/headers/XDataRevision"
          content:
            application/json:
              schema: { type: object }

  /api/v1/tournaments/{season}/{event}:
    get:
      tags: [tournaments]
      operationId: getTournament
      summary: Tournament document (get_section grain)
      description: |
        Leaderboard, field-progress ranks, rounds, cards, round_results, format.
        `ko_bracket` is null until ported.
      parameters:
        - $ref: "#/components/parameters/SeasonPath"
        - $ref: "#/components/parameters/EventPath"
      responses:
        "200":
          description: Tournament document
          headers:
            X-Data-Revision:
              $ref: "#/components/headers/XDataRevision"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentDocument"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/WarehouseMissing"

  /api/v1/tournaments/{season}/{event}/players/{player}:
    get:
      tags: [tournaments]
      operationId: getTournamentPlayer
      parameters:
        - $ref: "#/components/parameters/SeasonPath"
        - $ref: "#/components/parameters/EventPath"
        - { name: player, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Player tournament section (no KO)
          headers:
            X-Data-Revision:
              $ref: "#/components/headers/XDataRevision"
          content:
            application/json:
              schema: { type: object }

    get:
      tags: [tournaments]
      operationId: getTournament
      summary: Tournament document (get_section grain)
      description: |
        Target v1 shape of Flask `GET /tournament/get_section`.

        **Implemented now (kernel):** overall leaderboard + field-progress
        rank series. No KO bracket, no summary cards, no round-results table,
        no cut-line overlays.

        **Still Flask / later:** `ko_bracket`, `cards`, `round_results`,
        `best_efforts`, format/cut metadata. Those keys are omitted until
        ported; the URL does not change.
      parameters:
        - $ref: "#/components/parameters/SeasonPath"
        - $ref: "#/components/parameters/EventPath"
      responses:
        "200":
          description: Tournament kernel (grows into the full document)
          headers:
            X-Data-Revision:
              $ref: "#/components/headers/XDataRevision"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentDocument"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/WarehouseMissing"

  /api/v1/tournaments/section:
    get:
      tags: [tournaments]
      operationId: getTournamentSectionQuery
      summary: Tournament kernel (query-string alias)
      description: Same payload as `GET /api/v1/tournaments/{season}/{event}`.
      parameters:
        - $ref: "#/components/parameters/SeasonQuery"
        - $ref: "#/components/parameters/EventQuery"
      responses:
        "200":
          description: Tournament kernel
          headers:
            X-Data-Revision:
              $ref: "#/components/headers/XDataRevision"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentDocument"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/WarehouseMissing"

  /api/v1/clubs/{club}/history:
    get:
      tags: [clubs]
      operationId: getClubHistory
      summary: Club team × season matrix with table position
      description: |
        Same grain as Flask `GET /league/get_club_matrix` /
        `get_club_team_season_matrix`. Fuzzy-resolves the club label.
        Unknown clubs return 200 with empty `seasons` / `rows`.
      parameters:
        - $ref: "#/components/parameters/ClubPath"
      responses:
        "200":
          description: Club history matrix
          headers:
            X-Data-Revision:
              $ref: "#/components/headers/XDataRevision"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubHistory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/WarehouseMissing"

  /api/v1/clubs/history:
    get:
      tags: [clubs]
      operationId: getClubHistoryQuery
      summary: Club history (query-string alias)
      parameters:
        - $ref: "#/components/parameters/ClubQuery"
      responses:
        "200":
          description: Club history matrix
          headers:
            X-Data-Revision:
              $ref: "#/components/headers/XDataRevision"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubHistory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/WarehouseMissing"

components:
  headers:
    XDataRevision:
      description: Warehouse publish / import revision. Changes when Parquet is re-imported.
      schema:
        type: string
      example: "20260915T084441Z"

  parameters:
    SeasonPath:
      name: season
      in: path
      required: true
      description: Season label. Encode `/` as `%2F` (example `25%2F26`).
      schema:
        type: string
      example: "25/26"
    LeaguePath:
      name: league
      in: path
      required: true
      description: League code as stored on `game_line.event` (e.g. `BZL N1`).
      schema:
        type: string
    EventPath:
      name: event
      in: path
      required: true
      description: Tournament title as stored on `tournament_line.event`.
      schema:
        type: string
      example: Bayerische Meisterschaft - Männer Einzel
    SeasonQuery:
      name: season
      in: query
      required: true
      schema:
        type: string
      example: "25/26"
    EventQuery:
      name: event
      in: query
      required: true
      description: Tournament title. `tournament` is accepted as an alias.
      schema:
        type: string
    ClubPath:
      name: club
      in: path
      required: true
      description: Club display name (percent-encode spaces and umlauts).
      schema:
        type: string
      example: BC EMAX Unterföhring
    ClubQuery:
      name: club
      in: query
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: Missing required identifiers
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Unknown path
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Internal:
      description: Query failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    WarehouseMissing:
      description: DuckDB file not imported
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - missing_parameters
                - not_found
                - warehouse_missing
                - internal
            message:
              type: string

    Health:
      type: object
      required: [status, tables]
      properties:
        status:
          type: string
          enum: [ok, empty]
        warehouse:
          type: string
        revision:
          type: string
          nullable: true
        meta:
          type: object
          additionalProperties: true
        tables:
          type: object
          additionalProperties:
            type: integer
        error:
          $ref: "#/components/schemas/ErrorEnvelope/properties/error"

    LeaderboardRow:
      type: object
      required: [rank, player_name, total_scratch, total_pins, games]
      properties:
        rank:
          type: integer
        player_name:
          type: string
        player_id:
          type: string
          nullable: true
        club:
          type: string
          nullable: true
        total_scratch:
          type: number
        total_pins:
          type: number
          description: Scratch total, or score + handicap when `use_net` is true
        games:
          type: integer
        avg_scratch:
          type: number
          nullable: true
        avg_pins:
          type: number
          nullable: true

    FieldProgress:
      type: object
      required: [labels, player_rank_series, participant_count, slots]
      properties:
        labels:
          type: array
          items:
            type: string
          description: Game slots (`G1` … `Gn`)
        player_rank_series:
          type: object
          additionalProperties:
            type: array
            items:
              type: integer
          description: Rank after each slot, keyed by player name
        participant_count:
          type: integer
        slots:
          type: integer
        use_net:
          type: boolean

    TournamentDocument:
      type: object
      required: [season, event, leaderboard, field_progress]
      properties:
        revision:
          type: string
          description: Same value as X-Data-Revision
        season:
          type: string
        event:
          type: string
        use_net:
          type: boolean
          description: True when the event uses handicap / a priori average
        leaderboard:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardRow"
          description: |
            Kernel uses named rows. Full Flask `TableData` (`columns` + `data`)
            is not the v1 envelope — keep row objects; presentation stays in the SPA.
        field_progress:
          $ref: "#/components/schemas/FieldProgress"
        cards:
          type: array
          description: Not implemented (Flask `get_summary_cards`)
          items:
            type: object
        round_results:
          description: Not implemented (Flask round table)
          nullable: true
        rounds:
          type: array
          description: Not implemented
          items:
            type: object
        best_efforts:
          description: Not implemented
          nullable: true
        ko_bracket:
          description: Not implemented — stays in-process / Flask until ported
          nullable: true

    ClubHistoryItem:
      type: object
      required: [league, team]
      properties:
        league:
          type: string
        team:
          type: string
          nullable: true
        final_position:
          type: integer
          nullable: true
        team_count:
          type: integer
          nullable: true

    ClubHistorySeasonCell:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ClubHistoryItem"

    ClubHistoryRow:
      type: object
      required: [team_number, seasons]
      properties:
        team_number:
          type: string
          description: '"base" or the trailing team number ("1", "2", …)'
        seasons:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ClubHistorySeasonCell"

    ClubHistory:
      type: object
      required: [club, seasons, rows]
      properties:
        revision:
          type: string
        club:
          type: string
          description: Canonical club label after resolve
        seasons:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ClubHistoryRow"
